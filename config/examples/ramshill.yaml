perks:
  - {icon: hottub, title: Чан на терасі, text: У великих котеджах — власний.}
  - {icon: fireplace, title: Камін, text: Дрова вже чекають.}
  - {icon: mountain, title: Гори навколо, text: Краєвид із кожного вікна.}

faq:
  - q: Скільки гостей входить у ціну?
    a: У великому котеджі — четверо (максимум шість), у маленькому — двоє (максимум троє). За кожного додаткового гостя — 500 грн за ніч.
  - q: Чан входить у вартість?
    a: Ні, чан замовляється окремо — 2 500 грн за вечір. Позначте його у формі бронювання.
  - q: Чи можна забронювати два котеджі поруч?
    a: Так. Оформіть дві заявки на ті самі дати — календар показує, чи є ще вільні котеджі.

