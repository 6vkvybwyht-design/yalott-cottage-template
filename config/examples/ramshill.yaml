objects:
  - id: big
    name: Великий котедж
    short: Великий
    type: Котедж
    tagline: Камін і тераса з чаном
    description: |
      Просторий котедж для компанії до 6 гостей: дві спальні, два санвузли, вітальня з каміном і тераса з власним чаном.

      Базова ціна — за чотирьох гостей. У нас два однакові великі котеджі, тож можна приїхати двома компаніями поруч.
    featured: true
    icon: house
    units: 2                         # два однакові котеджі — бронюються окремо
    price: 8500                      # за ніч за 4 гостей
    base_guests: 4
    max_guests: 6
    extra_guest_price: 500           # за кожного гостя понад 4, за ніч
    min_nights: 1
    bedrooms: 2
    bathrooms: 2
    amenities:
      - Камін
      - Тераса з чаном
      - 2 спальні
      - 2 санвузли
      - Кухня з посудом
      - Wi‑Fi
      - Парковка

  - id: small
    name: Маленький котедж
    short: Маленький
    type: Котедж
    tagline: Для пари або невеликої родини
    description: |
      Затишний котедж для двох — із місцем для третього гостя. Усе необхідне для спокійного відпочинку в горах.

      Базова ціна — за двох гостей. Таких котеджів у нас чотири.
    icon: chalets
    units: 4                         # чотири однакові котеджі
    price: 6000                      # за ніч за 2 гостей
    base_guests: 2
    max_guests: 3
    extra_guest_price: 500
    min_nights: 1
    bedrooms: 1
    bathrooms: 1
    amenities:
      - Двоспальне ліжко
      - Кухонний куточок
      - Тераса
      - Wi‑Fi
      - Парковка

