faq:
  - q: Яка передоплата?
    a: 50% від вартості бронювання. Решта — під час заселення.
  - q: Чи можна скасувати бронювання?
    a: За 10 і більше днів до заїзду ми перенесемо дати. За 9 днів і менше передоплата не повертається.
  - q: Скільки коштує чан-джакузі?
    a: 2 500 грн для двох гостей, 3 000 грн для трьох-чотирьох. Форма бронювання порахує суму сама.
  - q: Коли заїзд і виїзд?
    a: Котедж 001 — заїзд після 15:00, виїзд до 12:00. Котедж 002 — заїзд після 14:00, виїзд до 11:00.

