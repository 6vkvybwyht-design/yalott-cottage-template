# ══════════════════════════════════════════════════════════════════════════════
#  КОНФІГ САЙТУ. Усе про клієнта — в цьому одному файлі. Код правити не потрібно.
#
#  Створити з нуля:      python manage.py new-client
#  Перевірити:           python manage.py validate
#  Залити в базу:        python manage.py seed
#
#  ПРАВИЛА ЗАПИСУ (YAML):
#    • відступи — лише пробілами (2 пробіли), не табуляцією;
#    • текст із двокрапкою, # або лапками беріть у "подвійні лапки";
#    • час і телефон — завжди в лапках: "15:00", "+380 67 123 45 67";
#    • порожнє значення "" = «не показувати на сайті».
#
#  ВАЖЛИВО ПРО ЦІНИ. Поля, позначені [БАЗА], — це ПОЧАТКОВІ значення. Під час першого
#  запуску вони записуються в базу; далі власник змінює їх в адмінці, і сайт бере їх
#  звідти. Зміна такого поля тут уже НЕ вплине на сайт (щоб не затерти правки власника).
#  Свідомо скинути базу до конфігу: python manage.py seed --reset
#  Усі інші поля (тексти, контакти, тема, правила) діють одразу після перезапуску сайту.
#
#  СЕКРЕТИ (пароль адмінки, токен Telegram, chat id) сюди НЕ пишуться — лише у файл .env.
#
#  Цей файл — демо-сайт «Forest House» з фото. Інші приклади: config/examples/.
# ══════════════════════════════════════════════════════════════════════════════

# ─── БРЕНД ────────────────────────────────────────────────────────────────────
brand:
  name: Forest House                 # назва (обов'язково) — у шапці, заголовках, сповіщеннях
  kind: Приватна садиба              # тип закладу перед назвою: «Приватна садиба Forest House»
  tagline: Три будинки серед лісу з видом на гори     # слоган, один рядок
  # Опис під заголовком на головній (2–3 речення).
  description: >
    Три будинки на закритій території серед лісу: апартаменти Green,
    двоповерховий котедж і будинок А-фрейм з видом на гори. Чан, баня й домашня кухня.
  # Логотип: шлях відносно папки static/. Порожньо — у шапці буде назва текстом.
  logo: media/brand/logo.png         # логотип для світлого тла
  logo_light: media/brand/logo-light.png   # логотип для темного тла (шапка, підвал). Порожньо = той самий
  favicon: media/brand/favicon.png   # іконка вкладки. Порожньо — згенерується з першої літери назви
  # Тема оформлення: dark (чорно-графітова, теплі вогні) | wood (світла, дерево) | forest (темно-зелена)
  theme: forest
  # Свої кольори поверх теми (необов'язково), формат "#rrggbb" у лапках:
  primary_color: ""                  # основний — кнопки
  accent_color: ""                   # акцентний — іконки, підзаголовки, виділення
  booking_prefix: FH                 # префікс коду бронювання (FH-7K2M9QXA). Порожньо — з назви

# ─── КОНТАКТИ ─────────────────────────────────────────────────────────────────
contacts:
  phone: "+380 67 000 00 00"         # телефон (обов'язково), як показувати на сайті
  viber: "+380670000000"             # номер Viber. Порожньо — кнопки не буде
  whatsapp: ""                       # номер WhatsApp
  telegram: ""                       # нік у Telegram без @ (для гостей; це НЕ бот сповіщень)
  instagram: forest_house2026        # нік в Instagram без @
  tiktok: foresthouse2023            # нік у TikTok без @
  email: ""                          # електронна пошта
  address: с. Назва, вул. Лісова, 1  # адреса (обов'язково)
  region: Львівська область          # область / район — другим рядком
  coordinates: [48.8372, 23.4456]    # [широта, довгота] для карти. Взяти: Google Maps → ПКМ на точці
  # Як доїхати. Абзаци розділяйте порожнім рядком.
  directions: |
    Автівкою: трасою до села, далі 2 км асфальтом за вказівниками. Під'їзд до воріт, парковка на території.

    Потягом: до найближчої станції, звідти таксі 10 хвилин — або ми зустрінемо за домовленістю.

# ─── ОБ'ЄКТИ (котеджі, будинки, апартаменти) ──────────────────────────────────
# Кожен об'єкт має свою сторінку (/<id>), свій календар і свої ціни.
objects:
  - id: a-frame                      # адреса сторінки й папка фото: media/objects/a-frame/. НЕ ЗМІНЮЙТЕ після запуску
    name: Будинок А-фрейм            # назва (обов'язково)
    short: А-фрейм                   # коротка назва для меню. Порожньо = name
    type: А-фрейм                    # тип: котедж, шале, апартаменти…
    tagline: Панорамне вікно з видом на гори      # рядок над назвою
    # Опис. Перший абзац — короткий вступ (показується і на картці). Абзаци розділяйте порожнім рядком.
    description: |
      Трикутний будинок із панорамним вікном на гори, каміном і спальнею під дахом. Для 2 дорослих і 2 дітей.

      Панорамне вікно на всю висоту фасаду відкриває вид на гори — і влітку, і в засніжену зиму.
      Унизу — вітальня з каміном, кухня й обідня зона, нагорі — спальня-антресоль під скатом даху.
    featured: true                   # true — великий блок на головній (лише в одного об'єкта)
    icon: aframe                     # іконка: house, aframe, apartment, chalets, tree, mountain…
    cover: ""                        # фото-обкладинка (ім'я файлу). Порожньо — перше фото з папки
    units: 1                         # [БАЗА] скільки ОДНАКОВИХ одиниць (напр. 2 однакові котеджі)
    price: 4000                      # [БАЗА] базова ціна за ніч, грн
    base_guests: 2                   # [БАЗА] скільки гостей входить у базову ціну
    max_guests: 4                    # [БАЗА] максимум гостей
    extra_guest_price: 300           # [БАЗА] доплата за кожного гостя понад base_guests, грн за ніч
    min_nights: 1                    # [БАЗА] мінімум ночей
    # [БАЗА] Знижка за тривалість (необов'язково): від N ночей — така ціна за ніч.
    long_stay:
      - {nights: 2, price: 3500}
      - {nights: 5, price: 3000}
    bedrooms: 1                      # спалень
    bathrooms: 1                     # санвузлів
    check_in: "14:00"                # час заїзду цього об'єкта. Порожньо = з розділу rules
    check_out: "12:00"               # час виїзду
    amenities:                       # зручності — список
      - Панорамне вікно з видом на гори
      - Камін
      - Спальня під дахом
      - Кухня з посудом
      - Кавоварка
      - Тераса
      - Wi‑Fi
      - Постільна білизна й рушники

  - id: cottage
    name: Двоповерховий котедж
    short: Котедж
    type: Котедж
    tagline: До 6 гостей, з каміном
    description: |
      Два поверхи для родини чи компанії: вітальня з каміном, кухня, спальні нагорі й власний двір з альтанкою.

      На першому поверсі — вітальня з каміном, їдальня й кухня, на другому — спальні під дахом.
      Біля будинку — літня кухня з мангалом, альтанка біля ставка й тераса.
    icon: house
    cover: "03"                      # вітальня з каміном (файл 03.webp)
    units: 1
    price: 4000
    base_guests: 4
    max_guests: 6
    extra_guest_price: 400
    min_nights: 1
    long_stay:
      - {nights: 2, price: 3500}
    bedrooms: 2
    bathrooms: 1
    amenities:
      - Камін
      - Повністю обладнана кухня
      - Обідній стіл на 6
      - Літня кухня з мангалом
      - Альтанка
      - Wi‑Fi
      - Постільна білизна й рушники

  - id: green
    name: Апартаменти Green
    short: Green
    type: Апартаменти
    tagline: Затишні апартаменти з терасою
    description: |
      Світла спальня, кухня-вітальня й власна тераса. Для пари або невеликої родини, яка хоче тиші серед лісу.

      Окрема спальня, кухня-вітальня з усім необхідним і довга дерев'яна тераса.
      Увечері — тепле світло ліхтарів і тиша лісу, вранці — кава на терасі.
    icon: apartment
    units: 1
    price: 2500
    base_guests: 2
    max_guests: 3
    extra_guest_price: 300
    min_nights: 1
    long_stay:
      - {nights: 2, price: 2200}
    bedrooms: 1
    bathrooms: 1
    amenities:
      - Двоспальне ліжко
      - Диван
      - Кухня з посудом
      - Тераса
      - Wi‑Fi
      - Парковка

# ─── ДОДАТКОВІ ПОСЛУГИ ────────────────────────────────────────────────────────
# Галочки у формі бронювання; сума додається до розрахунку. Розділ можна прибрати: extras: []
extras:
  - id: chan                         # id — латиницею; фото послуги: media/extras/chan.jpg
    name: Чан
    description: Карпатський чан на дровах із травами. Гріємо до вашого приходу, час необмежений.
    price: 3000                      # [БАЗА] ціна, грн
    # Одиниця ціни:
    #   evening      — за вечір (додається один раз)
    #   once         — за бронювання (один раз)
    #   night        — за ніч (× кількість ночей)
    #   person       — за людину (× кількість гостей)
    #   person_night — за людину за ніч (× гості × ночі)
    unit: evening
    icon: hottub                     # іконка, якщо немає фото
    # [БАЗА] Ціна залежно від кількості гостей (необов'язково). Приклад — у config/examples/blackhouse.yaml:
    # guest_prices:
    #   - {up_to: 2, price: 2500}    # до 2 гостей
    #   - {up_to: 4, price: 3000}    # 3–4 гості
  - id: banya
    name: Баня
    description: Дров'яна баня з купіллю — тільки для вашої компанії.
    price: 2000
    unit: evening
    icon: flame
  - id: breakfast
    name: Сніданок
    description: Домашній сніданок із місцевих продуктів, подаємо в будинок.
    price: 250
    unit: person_night
    icon: dish

# ─── СЕЗОНИ ───────────────────────────────────────────────────────────────────
# [БАЗА] Періоди з особливою ціною. Ніч, що потрапляє в сезон, рахується за ціною сезону;
# бронювання може перетинати межу сезону. Дати — РРРР-ММ-ДД, перша й остання НІЧ включно.
# Для кожного сезону вкажіть ОДНЕ з трьох:
#   price: 6000                 — одна ціна для всіх об'єктів
#   prices: {id: ціна, …}       — своя ціна для кожного об'єкта (не вказаний — за звичайною)
#   on_request: true            — «ціна за домовленістю» (сайт не рахує суму, заявку прийме)
# Сезони одного об'єкта не можуть перетинатися.
seasons:
  - name: Новорічні свята
    start: 2026-12-28
    end: 2027-01-08
    prices:
      a-frame: 7000
      cottage: 8000
      green: 4500
  - name: Великодні вихідні
    start: 2027-04-30
    end: 2027-05-03
    on_request: true

# ─── ПРАВИЛА ──────────────────────────────────────────────────────────────────
rules:
  prepayment_percent: 30             # передоплата, % від суми (обов'язково). 0 — без передоплати
  check_in: "14:00"                  # час заїзду за замовчуванням (об'єкт може мати свій)
  check_out: "12:00"                 # час виїзду за замовчуванням
  cancellation:
    days: 7                          # за скільки днів до заїзду можна скасувати / перенести без втрат
    text: Якщо попередити не пізніше ніж за 7 днів до заїзду — перенесемо дати або повернемо передоплату. Пізніше передоплата не повертається.
  pets: За попередньою домовленістю — уточніть телефоном.       # тварини. Порожньо "" — пункт не показується
  smoking: Не куримо всередині. Палити можна лише надворі.        # куріння
  quiet: Тиша після 22:00 — поважаємо відпочинок інших гостей.    # тиша
  # Свої додаткові правила (необов'язково):
  extra:
    - {icon: lock, title: Закрита територія, text: Лише для гостей садиби — без сторонніх.}

# ─── БЛОКИ ГОЛОВНОЇ СТОРІНКИ ──────────────────────────────────────────────────
# true — показувати, false — приховати. Об'єкти, бронювання, правила й контакти є завжди.
sections:
  about: true                        # переваги (список perks нижче)
  extras: true                       # послуги (чан, баня…)
  gallery: true                      # галерея з media/gallery/
  prices: true                       # таблиця цін
  reviews: true                      # відгуки
  faq: true                          # часті питання
  nearby: true                       # що цікавого поруч
  map: true                          # карта й «як доїхати»

# Переваги — короткі картки під банером (блок about).
perks:
  - {icon: lock, title: Закрита територія, text: Лише для гостей садиби.}
  - {icon: hottub, title: Чан і баня, text: Тільки для вас — час необмежений.}
  - {icon: mountain, title: Вид на гори, text: Панорама з вікон і терас.}
  - {icon: dish, title: Домашня кухня, text: Сніданки й страви за домовленістю.}
  - {icon: tree, title: Ліс поруч, text: Починається одразу за садибою.}
  - {icon: parking, title: Парковка, text: Безкоштовно на території.}

# Заголовок і текст блоку «Галерея».
gallery:
  title: Територія та кухня
  text: Чан, баня, альтанка біля ставка й домашні сніданки — усе на закритій території.

# Відгуки гостей.
reviews:
  - text: Тут текст відгуку гостя. Що сподобалось найбільше — будинок, чан, краєвид, господарі.
    author: Ім'я гостя
    meta: А-фрейм · жовтень 2026     # звідки / коли (необов'язково)
  - text: Тут текст відгуку гостя. Два-три речення про відпочинок.
    author: Ім'я гостя
    meta: Котедж · вересень 2026
  - text: Тут текст відгуку гостя. Можна скопіювати з Instagram чи Google.
    author: Ім'я гостя
    meta: Апартаменти Green · серпень 2026

# Часті питання: q — питання, a — відповідь.
faq:
  - q: Як забронювати?
    a: Оберіть будинок і дати в календарі, залиште заявку — ми зателефонуємо, підтвердимо деталі й надішлемо реквізити для передоплати.
  - q: Чи можна з дітьми?
    a: Так, діти будь-якого віку. Дитяче ліжечко — за запитом.
  - q: Чан і баня входять у вартість?
    a: Ні, вони замовляються окремо — позначте їх у формі бронювання, і сума порахується автоматично.
  - q: Чи є де готувати?
    a: У кожному будинку є кухня з посудом, на території — мангал.

# Що цікавого поруч. distance — необов'язково.
nearby:
  - {icon: tree, title: Грибні місця, text: Ліс із грибами й ягодами., distance: 100 м}
  - {icon: compass, title: Гірські маршрути, text: Пішохідні стежки з видом на гори., distance: 1 км}
  - {icon: dish, title: Ресторани, text: Заклади неподалік — підкажемо найкращі., distance: 3 км}

# ─── SEO ──────────────────────────────────────────────────────────────────────
seo:
  title: Приватна садиба Forest House — будинки з чаном і банею в Карпатах   # заголовок у пошуку й вкладці
  description: Три будинки серед лісу з видом на гори. Чан, баня, домашня кухня. Онлайн-бронювання без комісій.
  og_image: ""                       # картинка для соцмереж (шлях у static/). Порожньо — фото банера
  lang: uk                           # мова сайту

# Підпис розробника в підвалі.
studio:
  name: Yalott Studio
  url: https://yalott-studio.netlify.app
